kotlin = "2.3.0"
# Compose. The BOM pins every androidx.compose.* artifact to one tested set, so the
# individual libraries carry no version. The compiler plugin must match the Kotlin
# version exactly (it is released in lockstep with the compiler).
composeBom = "2026.01.01"
lifecycle = "2.10.0"
luaj = "3.0.1"
material = "1.13.0"
minecraftauth = "main-SNAPSHOT"
okhttp = "5.3.2"
pkix = "1.54.0.0"
playServicesGamesV2 = "21.0.0"
preference-ktx = "1.2.1"
profileinstaller = "1.4.1"
leakcanary = "2.14"
roomRuntime = "2.8.5"
simpleXml = "2.7.1"
billing = "8.3.0"
sqliteFramework = "2.6.2"
dynamicanimation = "1.1.0"
transition = "1.7.2"
asynclayoutinflater = "1.1.0"
xcrash = "3.1.2"
# Pure-Java Opus (BSD-3), so the voice relay needs no per-ABI native codec build. JitPack's
# immutable build coordinate (`master-<sha>-1`) is unusable: its POM still declares
# `master-SNAPSHOT`, which Gradle rejects as inconsistent module metadata. The plain `master`
# coordinate resolves, and matches the moving coordinates this project already uses
# (MinecraftAuth `main-SNAPSHOT`, bedrock-connection `...-SNAPSHOT`).
concentus = "master"
# CFR (MIT) is the Java decompiler the JavaBridge auto-porter uses. MIT, so it can be
# bundled in an Apache-2.0 APK; it is a plain jar with no Android dependencies.
cfr = "0.152"

