name: Bug report
description: Report a crash, a glitch, or something that does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. Please answer every field you can —
        the diagnostics screen (Settings → Diagnostics) generates a copyable report that covers most of these.
  - type: input
    id: version
    attributes:
      label: GlowberryClient version
      description: Shown in Settings → About, or on the release page you installed from.
      placeholder: e.g. BETA3
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & Android version
      placeholder: e.g. Pixel 7, Android 14
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version / import source
      description: Which Bedrock version was selected, and was it imported from the Installations tab or pointed at an installed copy?
      placeholder: e.g. 1.21.60, imported via mcpedl.org
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: What happened?
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import the APK...
        2. Enable the mod...
        3. Press Play...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: If possible, paste the report from Settings → Diagnostics → Copy report. This includes app/preloader versions, signature DB status, cosmetics hook status, extraction version, and any mod load errors.
      render: text
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I searched the existing issues (open and closed) first and found no duplicate.
          required: true
        - label: I am running a build from the official Releases or CI artifacts, not a modified APK.
          required: true