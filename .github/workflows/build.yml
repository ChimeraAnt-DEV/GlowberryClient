name: Build Debug APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle dependencies and wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          # setup-android's default package list includes the legacy `tools` package,
          # which Google removed from the SDK repo in 2025; only install platform-tools.
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK platform 36 and build tools 35.0.0
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run unit tests
        # The resource, translation and accessibility gates live in the unit tests, so a pull
        # request that breaks one has to fail here rather than at review time.
        run: ./gradlew testDebugUnitTest

      - name: Run lint (accessibility, unused resources, new-API gate)
        # App/lint.xml promotes the accessibility checks (ContentDescription, LabelFor,
        # TouchTargetSizeCheck) and NewApi to errors and captures the pre-existing backlog in
        # lint-baseline.xml, so this step fails only on a NEW offender. Without it, an unlabelled
        # icon-only button or an API-above-minSdk reference lands unnoticed, because neither is
        # visible on a build machine.
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error