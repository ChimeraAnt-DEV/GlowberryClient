name: Android CI

on:
  push:
    branches:
      - "**"
    tags:
      - v*
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Validate release content
        run: python3 scripts/validate_release_content.py

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "HAS_GOOGLE_SERVICES=false" >> "$GITHUB_ENV"
            echo "GOOGLE_SERVICES_JSON_BASE64 is not configured; using a CI-only Firebase placeholder for compile checks."
            mkdir -p app
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.chimeramc.client"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIOnlyPlaceholderKey"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            exit 0
          fi

          mkdir -p app
          printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > app/google-services.json
          python3 -m json.tool app/google-services.json > /dev/null
          python3 - <<'PY'
          import json
          import sys

          expected = "org.chimeramc.client"
          with open("app/google-services.json", encoding="utf-8") as fp:
              data = json.load(fp)

          package_names = {
              client.get("client_info", {})
              .get("android_client_info", {})
              .get("package_name")
              for client in data.get("client", [])
          }
          if expected not in package_names:
              actual = ", ".join(sorted(name for name in package_names if name)) or "<none>"
              print(
                  f"google-services.json package_name mismatch: expected {expected}, got {actual}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
          echo "HAS_GOOGLE_SERVICES=true" >> "$GITHUB_ENV"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          # setup-android's default package list includes the legacy `tools` package,
          # which Google removed from the SDK repo in 2025; only install platform-tools.
          packages: platform-tools

      - name: Accept Licenses
        run: yes | sdkmanager --licenses

      - name: Install Build Tools 35.0.0
        run: sdkmanager "build-tools;35.0.0"

      - name: Verify installed SDK Packages
        run: sdkmanager --list

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Run preloader host tests
        # Item 21 (preloader update list): the pure C++ logic (geometry parser, animation
        # solver, socket protocol, hook-install gate, version compare, ...) is device-free and
        # must break the build on every commit, not only on a device. The runner self-fetches
        # nlohmann/json into a gitignored cache when needed.
        run: bash app/src/main/cpp/preloader/tests/cosmetics/run_tests.sh

      - name: Run Python tooling host tests
        # The rule-generation helpers, the offline binary analyzer and the release checksum
        # helper are pure Python. numpy is required by the analyzer's instruction scan; without
        # it the analyzer test would skip the assertions it exists to make, so it is installed
        # rather than left to the runner's default image.
        run: |
          python3 -m pip install --quiet numpy
          python3 tools/tests/gen_rules_test.py
          python3 tools/tests/verify_binary_test.py
          python3 scripts/tests/compute_checksums_test.py
          python3 scripts/tests/release_notes_test.py

      - name: Inject API Keys
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: echo "curseforge.api_key=${CF_API_KEY}" >> local.properties

      - name: Build Debug, Beta and Unsigned Release APKs
        if: env.HAS_GOOGLE_SERVICES == 'true'
        run: ./gradlew assembleDebug assembleBeta assembleRelease

      - name: Compile Debug Without Firebase Secrets
        if: env.HAS_GOOGLE_SERVICES == 'false'
        run: ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Check for calls newer than minSdk 28
        # J5: this class of bug shipped because CI only built an APK. The static half fails fast
        # (seconds) on a banned call; the emulator job below proves it at runtime on API 28.
        run: ./gradlew :app:testDebugUnitTest --tests '*Api28CompatTest*'

      - name: Compute APK checksums
        # B16: no public artifact ships without a digest. Write a coreutils-format
        # <file>.sha256 sidecar next to every built APK; the upload steps below carry both.
        if: env.HAS_GOOGLE_SERVICES == 'true'
        run: python3 scripts/compute_checksums.py --dir app/build/outputs/apk

      - name: Upload Debug APK
        if: env.HAS_GOOGLE_SERVICES == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ChimeraClient-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk.sha256

      - name: Upload Unsigned Release APK
        if: env.HAS_GOOGLE_SERVICES == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ChimeraClient-release-unsigned-apk
          path: |
            app/build/outputs/apk/release/*-unsigned.apk
            app/build/outputs/apk/release/*-unsigned.apk.sha256

      - name: Upload Beta APK
        if: env.HAS_GOOGLE_SERVICES == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ChimeraClient-beta-apk
          path: |
            app/build/outputs/apk/beta/*.apk
            app/build/outputs/apk/beta/*.apk.sha256

      - name: Sign Release APK
        if: env.HAS_GOOGLE_SERVICES == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_STORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Rename and checksum signed APK
        if: env.HAS_GOOGLE_SERVICES == 'true' && startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF_NAME}
          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          APK_DST="ChimeraClient-${TAG}-release.apk"
          cp "$SIGNED_APK" "$APK_DST"
          echo "Signed APK renamed to $APK_DST"
          # B16: the published release carries a digest next to the signed APK.
          python3 scripts/compute_checksums.py --dir . --pattern "${APK_DST}"
          echo "Checksum: $(cat "${APK_DST}.sha256")"

      - name: Upload Signed APK Artifact
        if: env.HAS_GOOGLE_SERVICES == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ChimeraClient-${{ github.ref_name }}-release.apk
          path: |
            ChimeraClient-${{ github.ref_name }}-release.apk
            ChimeraClient-${{ github.ref_name }}-release.apk.sha256

      - name: Generate GitHub release notes
        if: env.HAS_GOOGLE_SERVICES == 'true' && startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/render_release_notes.py resources/launcher/changelog.json release-notes.md

      - name: Release APK to GitHub Releases
        if: env.HAS_GOOGLE_SERVICES == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ChimeraClient-${{ github.ref_name }}-release.apk
            ChimeraClient-${{ github.ref_name }}-release.apk.sha256
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        if: env.HAS_GOOGLE_SERVICES == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          APK_URL: "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ChimeraClient-${{ github.ref_name }}-release.apk"
          TAG_NAME: ${{ github.ref_name }}
        run: |
          EMBED_TITLE="ChimeraClient Update!"
          EMBED_DESC="A new version of **ChimeraClient** is ready."
          EMBED_COLOR=5814783
          THUMB_URL='https://avatars.githubusercontent.com/u/78095377?s=200&v=4'

          curl -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"$EMBED_TITLE\",
              \"description\": \"$EMBED_DESC\",
              \"color\": $EMBED_COLOR,
              \"thumbnail\": { \"url\": \"$THUMB_URL\" },
              \"fields\": [
                {
                  \"name\": \"Version\",
                  \"value\": \"\`$TAG_NAME\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"Download\",
                  \"value\": \"[**Click here to download APK**]($APK_URL)\",
                  \"inline\": true
                }
              ]
            }]
          }" \
          "$DISCORD_WEBHOOK"

  # J5: run the app on the minimum supported API and on the target API. The launch crash
  # (InputStream.readAllBytes, API 33) was invisible to a build-only pipeline and to the JVM test
  # suite, because a desktop JDK has that method. Only a real API 28 runtime can catch it.
  instrumented-smoke:
    # Manual only, and here is why it cannot be an automatic gate.
    #
    # The APK ships arm64-v8a only (app/build.gradle sets abiFilters 'arm64-v8a': an Android process
    # locks in one bitness and the prebuilt libgxcore.so has no 32-bit or x86 build). That rules out
    # the usual x86_64 emulator - the install is refused with "No compatible devices connected"
    # before a single test runs, which is what this job used to do on every push.
    #
    # An arm64 system image needs an arm64 host, and GitHub's arm64 runners have no /dev/kvm
    # ("Failed to open the device 'kvm': Invalid argument"), so the emulator cannot be accelerated
    # there and would take longer to boot than a runner is allowed to live.
    #
    # So: the static scan in Api28CompatTest (build job, seconds) is the automatic gate, and this
    # job is for a self-hosted arm64 runner with KVM or a real device attached. It is kept rather
    # than deleted because the runtime check is the one that proves the fix, and the test source
    # runs on any developer's device.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 35]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare google-services.json (CI placeholder)
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            mkdir -p app
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "org.chimeramc.client" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyCIOnlyPlaceholderKey" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            echo "Wrote a CI-only Firebase placeholder for the instrumented run."
          fi
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Run instrumented API smoke tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # Must match the APK's only ABI, or the install is refused before the tests start.
          arch: arm64-v8a
          # The app is landscape-only and native-heavy, and an arm64 emulator on an arm64 host
          # without nested-virtualisation acceleration boots slowly. Give it room.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 1200
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: instrumented-report-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
