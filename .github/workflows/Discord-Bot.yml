name: Discord Update Bot

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      title:
        description: 'Update Title'
        required: true
        default: 'New ChimeraClient Update!'
      message:
        description: 'Update Message'
        required: true
        default: 'Check out the new features!'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Webhook secret is empty!"
            exit 1
          fi

          # Sanitize the URL (removes accidental spaces)
          SANITIZED_URL=$(echo "$WEBHOOK_URL" | tr -d '[:space:]')

          if [ "${{ github.event_name }}" == "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            NAME="${{ github.event.release.name }}"
            BODY="${{ github.event.release.body }}"
            URL="${{ github.event.release.html_url }}"

            if [ -z "$BODY" ]; then
              BODY="No detailed changelog provided. Click the link below to view the release."
            fi

            TRUNCATED_BODY=$(echo "$BODY" | head -c 1500)
            
            # Build the message with title, changelog, and clickable link
            MESSAGE=$(printf "**%s (%s)** \n\n%s\n\n**[View Full Release on GitHub](%s)**" "$NAME" "$TAG" "$TRUNCATED_BODY" "$URL")
          else
            TITLE="${{ github.event.inputs.title }}"
            BODY="${{ github.event.inputs.message }}"
            
            MESSAGE=$(printf "**%s** \n\n%s" "$TITLE" "$BODY")
          fi

          # Create JSON payload safely
          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')

          # Send to Discord
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "$SANITIZED_URL"
