def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def getGitCommit() {
    // The short commit hash, so a report names the exact revision. A shallow checkout still has the
    // single commit it was fetched at, so this succeeds where `git describe --tags` does not; a
    // failure falls back to "unknown" rather than breaking the build.
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short=7', 'HEAD'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
        }
        def commit = stdout.toString().trim()
        if (commit != null && !commit.isEmpty()) {
            return commit
        }
    } catch (ignored) {
    }
    return "unknown"
}

def getGitTag() {
    def tag = "unknown"
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--abbrev=0'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
        }
        tag = stdout.toString().trim()
        if (tag.startsWith("v")) {
            tag = tag.substring(1)
        }
    } catch (ignored) {
    }
    if (tag == null || tag.isEmpty() || tag == "unknown") {
        // A shallow CI checkout (fetch-depth: 1) has no tags, so `git describe` fails and the
        // version used to be stamped as "unknown" — which is what the in-app diagnostics report
        // printed as "App version: unknown". Fall back to the committed version file so every
        // build names a real version.
        try {
            def props = new Properties()
            def versionFile = rootProject.file('version.properties')
            if (versionFile.exists()) {
                versionFile.withInputStream { props.load(it) }
                def fromFile = props.getProperty('version.name', '').trim()
                if (!fromFile.isEmpty()) {
                    tag = fromFile
                }
            }
        } catch (ignored) {
        }
    }
    return tag
}

static def getVersionCodeByTimestamp() {
    def baseDate = Date.parse("yyyy-MM-dd HH:mm:ss", "2025-01-01 00:00:00")
    def now = new Date()
    def diff = (now.time - baseDate.time) / 1000
    return diff.toInteger()
}

// G6: stale-stub trap guard. The native build compiles the preloader and libHttpClient git
// submodules. If they were never checked out (a shallow clone / a zip download), the extracted
// directory is empty or holds a leftover stub, and CMake either fails with a confusing error or
// silently builds against a stale native output. Fail fast here with the fix instead of letting a
// broken assembly reach the APK.
def requiredSubmoduleCmake = [
        new File("${projectDir}/src/main/cpp/preloader/CMakeLists.txt"),
        new File("${projectDir}/src/main/cpp/libHttpClient/Build/libHttpClient.Android/CMakeLists.txt"),
]

def verifySubmodules = tasks.register("verifyNativeSubmodules") {
    doFirst {
        def missing = requiredSubmoduleCmake.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "Native build submodules are not checked out. Missing: ${missing.collect { it.path }}.\n" +
                            "Run: git submodule sync && git submodule update --init --recursive, then ./gradlew clean\n" +
                            "(a stale native build output can persist otherwise)."
            )
        }
    }
}
tasks.named('preBuild') {
    dependsOn verifySubmodules
}
tasks.matching { it.name.startsWith('merge') || it.name.startsWith('compile') || it.name == 'externalNativeBuildDebug' || it.name == 'externalNativeBuildRelease' }.configureEach {
    dependsOn verifySubmodules
}

android {
    namespace 'org.chimeramc.client'
    compileSdkVersion 36
    defaultConfig {
        applicationId "org.chimeramc.client"
        minSdkVersion 28
        targetSdkVersion 35
        versionCode getVersionCodeByTimestamp()
        versionName getGitTag()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "CURSEFORGE_API_KEY", "\"${localProperties.getProperty('curseforge.api_key', '')}\""
        // The relay address users get without typing one. Baked in at build time from a local
        // property (gitignored), so the shipped app can default to the operator's own server while
        // the source stays free of a hardcoded host. Empty means "LAN only until configured".
        buildConfigField "String", "DEFAULT_VOICE_RELAY_ADDRESS", "\"${localProperties.getProperty('voice.relay.address', '')}\""
        // The crash-report collector the "Crash report upload" switch sends to. Empty in the
        // shipped source, so no collector address is published with the code; when an operator
        // sets the property the upload runs for real. The switch is disabled while this is empty
        // rather than pretending to send something.
        buildConfigField "String", "CRASH_UPLOAD_ENDPOINT", "\"${localProperties.getProperty('crash.upload.endpoint', '')}\""
        // Item 177: the About screen names the build's commit, so a screenshot of it identifies the
        // revision even when the version name is a moving tag.
        buildConfigField "String", "GIT_COMMIT", "\"${getGitCommit()}\""
        // Item 255: the announcements feed the Launch tab reads. Empty in the shipped source, so
        // no URL is published with the code; when an operator sets `announcements.url` the card
        // appears for builds the feed's version gate covers. Empty means "no card", never an error.
        buildConfigField "String", "ANNOUNCEMENTS_URL", "\"${localProperties.getProperty('announcements.url', '')}\""
        // Item 273: the mod-update feed the daily check reads. Empty in the shipped source, so no
        // URL is published with the code; when an operator sets `mods.update.url` the check runs
        // and reports one summary. Empty means "no check", never an error.
        buildConfigField "String", "MOD_UPDATE_FEED_URL", "\"${localProperties.getProperty('mods.update.url', '')}\""
        // Item 281: the anonymous usage-counter collector. Empty in the shipped source, so no
        // address is published with the code and the opt-in switch is inert until an operator sets
        // `usage.stats.endpoint`. The Settings row shows the exact payload before consent.
        buildConfigField "String", "USAGE_STATS_ENDPOINT", "\"${localProperties.getProperty('usage.stats.endpoint', '')}\""
        ndk {
            // 64-bit only: 32-bit (armeabi-v7a) instances cannot run in this app
            // (Android processes lock in one bitness), so only ship arm64-v8a.
            // A separate 32-bit-focused launcher is planned for the future.
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildFeatures {
        viewBinding true
        prefab true
        buildConfig true
        compose true
    }
    sourceSets {
        main {
            assets.srcDirs += rootProject.file('resources')
            // Item 292: the baseline profile is packaged so ProfileInstaller can install it at first
            // run. AGP compiles it into the APK's dexopt profile; on device it is applied without a
            // Play Store update.
            baselineProfiles.srcDirs += 'src/main/baselineProfiles'
        }
    }
    buildTypes {
        release {
            // R8 shrinks and obfuscates the release build. JNI-bound classes are kept by
            // proguard-rules.pro; JniBindingParityTest runs against the minified build in CI so a
            // stripped native binding fails the build rather than the app at runtime.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                // Only the symbol table ships; full debug info goes out as a separate symbol file
                // for crash decoding instead of into every APK.
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            buildConfigField "boolean", "IS_BETA", "false"
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
            buildConfigField "boolean", "IS_BETA", "false"
            externalNativeBuild {
                cmake {
                    // Item 388: the preloader times each post-render callback and names one that
                    // overruns, but only when this define is present. It is a preloader-specific
                    // define rather than NDEBUG because the NDK toolchain defines NDEBUG for this
                    // build type too (AGP configures CMake as RelWithDebInfo), so NDEBUG cannot
                    // express "a debug build". Release and beta omit it, so the shipped detour
                    // carries neither the clock read nor the branch.
                    arguments "-DANDROID_STL=c++_shared", "-DPRELOADER_HOOK_TIMING=1"
                }
            }
        }
        beta {
            initWith release
            // The beta channel is the release build under a different name, so it inherits R8 and
            // the symbol-table level from release rather than redeclaring them.
            resValue "string", "app_name", "Glowberry Client Beta"
            buildConfigField "boolean", "IS_BETA", "true"
            matchingFallbacks = ["release"]
        }

    }
    packagingOptions {
        // Item 9: legacy packaging extracts the .so files to the app's lib dir on install, which
        // the launcher's own extractor and the preloader's file-based hooks rely on. Re-check
        // before turning this off.
        jniLibs.useLegacyPackaging = true
        resources.excludes += [
                "DebugProbesKt.bin"
        ]

        resources.pickFirsts += [
                "META-INF/INDEX.LIST",
                "META-INF/DEPENDENCIES",
                "META-INF/io.netty.versions.properties"
        ]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    // The Kotlin toolchain must match the Java target: the Compose compiler emits JVM 21 bytecode
    // to sit beside the Java sources, so Kotlin cannot default to a lower jvmTarget.
    kotlin {
        jvmToolchain(21)
    }

    // Item 330/346: lint is a gate, not advice. The accessibility and unused-resource checks are
    // errors (see app/lint.xml), and everything already present is captured in the baseline so the
    // gate fires on a new offender rather than on the backlog. abortOnError makes `lintDebug`
    // usable as a CI step.
    lint {
        baseline = file("lint-baseline.xml")
        checkAllWarnings = true
        warningsAsErrors = false
        abortOnError = true
        checkDependencies = false
        // The generated binding classes and the packaged assets are not hand-written source.
        checkGeneratedSources = false
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    ndkVersion = "28.2.13676358"

    // Item 286: simple-xml (used by the bundled Xbox XLE serialization) drags in xpp3, which ships
    // its own org.xmlpull.v1.XmlPullParser. Android already provides that class in the platform, so
    // R8 refuses the program/library clash ("Library class android.content.res.XmlResourceParser
    // implements program class org.xmlpull.v1.XmlPullParser") and the release build cannot be
    // minified at all. Excluding the bundled pull parser leaves the platform copy, which is the
    // implementation the runtime actually uses.
    configurations.configureEach {
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'stax', module: 'stax'
        exclude group: 'stax', module: 'stax-api'
    }
}

dependencies {
    implementation project(':minecraft')
    implementation project(':pojav_controls')
    implementation libs.minecraftauth
    implementation libs.commons.httpclient
    implementation libs.commons.gson
    implementation libs.core.splashscreen
    implementation libs.appcompat
    implementation libs.conscrypt.android
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.gson
    implementation libs.luaj.jse
    implementation libs.concentus
    // JavaBridge auto-porter: CFR (MIT) decompiles Java Edition .class files so their source
    // can be sent to an LLM for reimplementation. No Android APIs, plain jar.
    implementation libs.cfr
    implementation libs.androidx.preference.ktx
    // Item 292: ProfileInstaller ships the baseline profile in the APK and installs it at first run,
    // so the startup path is compiled ahead of time on device. Works on every supported version.
    implementation libs.androidx.profileinstaller
    implementation libs.androidx.games.activity
    implementation libs.okhttp
    implementation libs.androidx.dynamicanimation
    // Item 124: TransitionManager drives the settings section change without a re-inflate.
    implementation libs.androidx.transition
    // Item 130: heavy screens inflate off the main thread.
    implementation libs.androidx.asynclayoutinflater
    implementation libs.androidx.browser
    implementation libs.bedrock.connection
    implementation libs.xcrash
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging
    // Microsoft Authentication Library (MSAL) for official OAuth
    implementation 'com.microsoft.identity.client:msal:8.6.0'
    testImplementation libs.junit
    // Android ships org.json in the platform, so the local unit-test runtime has stubs that
    // throw "not mocked". org.json:json is the same API as a plain jar, so a JSON-parsing
    // rule stays unit-testable without an instrumented test.
    testImplementation 'org.json:json:20260814'
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Item 297: LeakCanary watches for activity-context leaks in debug builds only. Its own
    // AppInitializer installs it via the AndroidX startup provider, so no code change is needed in
    // the application class; a release build never sees the dependency.
    debugImplementation libs.leakcanary.android
    implementation libs.glide
    // Compose. The BOM aligns every androidx.compose.* version; the rest carry no version.
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    debugImplementation libs.compose.ui.tooling
}

// Item 270: the in-app changelog renders the repo's CHANGELOG.md, so there is one source of truth.
// This copies it into the packaged assets at build time instead of keeping a second hand-edited
// copy that drifts.
//
// The two-section feed (resources/launcher/changelog_feed.json) is NOT copied here: `resources/` is
// already an assets source root (see sourceSets above), so it reaches the APK on its own. Copying it
// as well made mergeDebugAssets fail with "Duplicate resources" — the same asset from two roots.
// The sneak-peek images do need copying, because docs/assets is not an assets root.
def changelogAssetsDir = layout.buildDirectory.dir('generated/changelogAssets')

tasks.register('syncChangelogAsset', Copy) {
    from(rootProject.file('CHANGELOG.md')) {
        into 'launcher'
    }
    // The sneak-peek images the feed names, copied to launcher/sneak/ so the app can load them by
    // the file name the feed carries. These are the real peeks pulled from the Discord channel, not
    // the repo's generated mockups, so the in-app feed shows what was actually posted.
    from(rootProject.file('docs/assets/sneakpeeks')) {
        into 'launcher/sneak'
        include '*.png'
    }
    into changelogAssetsDir
}

android.sourceSets.main.assets.srcDir(changelogAssetsDir)

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn 'syncChangelogAsset'
}
