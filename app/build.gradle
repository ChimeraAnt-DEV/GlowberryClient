def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def getGitTag() {
    def tag = "unknown"
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--abbrev=0'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
        }
        tag = stdout.toString().trim()
        if (tag.startsWith("v")) {
            tag = tag.substring(1)
        }
    } catch (ignored) {
    }
    if (tag == null || tag.isEmpty() || tag == "unknown") {
        // A shallow CI checkout (fetch-depth: 1) has no tags, so `git describe` fails and the
        // version used to be stamped as "unknown" — which is what the in-app diagnostics report
        // printed as "App version: unknown". Fall back to the committed version file so every
        // build names a real version.
        try {
            def props = new Properties()
            def versionFile = rootProject.file('version.properties')
            if (versionFile.exists()) {
                versionFile.withInputStream { props.load(it) }
                def fromFile = props.getProperty('version.name', '').trim()
                if (!fromFile.isEmpty()) {
                    tag = fromFile
                }
            }
        } catch (ignored) {
        }
    }
    return tag
}

static def getVersionCodeByTimestamp() {
    def baseDate = Date.parse("yyyy-MM-dd HH:mm:ss", "2025-01-01 00:00:00")
    def now = new Date()
    def diff = (now.time - baseDate.time) / 1000
    return diff.toInteger()
}

// G6: stale-stub trap guard. The native build compiles the preloader and libHttpClient git
// submodules. If they were never checked out (a shallow clone / a zip download), the extracted
// directory is empty or holds a leftover stub, and CMake either fails with a confusing error or
// silently builds against a stale libgxcore.so. Fail fast here with the fix instead of letting a
// broken assembly reach the APK.
def requiredSubmoduleCmake = [
        new File("${projectDir}/src/main/cpp/preloader/CMakeLists.txt"),
        new File("${projectDir}/src/main/cpp/libHttpClient/Build/libHttpClient.Android/CMakeLists.txt"),
]

def verifySubmodules = tasks.register("verifyNativeSubmodules") {
    doFirst {
        def missing = requiredSubmoduleCmake.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "Native build submodules are not checked out. Missing: ${missing.collect { it.path }}.\n" +
                            "Run: git submodule sync && git submodule update --init --recursive, then ./gradlew clean\n" +
                            "(a stale stub libgxcore.so can persist otherwise)."
            )
        }
    }
}
tasks.named('preBuild') {
    dependsOn verifySubmodules
}
tasks.matching { it.name.startsWith('merge') || it.name.startsWith('compile') || it.name == 'externalNativeBuildDebug' || it.name == 'externalNativeBuildRelease' }.configureEach {
    dependsOn verifySubmodules
}

android {
    namespace 'org.chimeramc.client'
    compileSdkVersion 36
    defaultConfig {
        applicationId "org.chimeramc.client"
        minSdkVersion 28
        targetSdkVersion 35
        versionCode getVersionCodeByTimestamp()
        versionName getGitTag()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "CURSEFORGE_API_KEY", "\"${localProperties.getProperty('curseforge.api_key', '')}\""
        // The relay address users get without typing one. Baked in at build time from a local
        // property (gitignored), so the shipped app can default to the operator's own server while
        // the source stays free of a hardcoded host. Empty means "LAN only until configured".
        buildConfigField "String", "DEFAULT_VOICE_RELAY_ADDRESS", "\"${localProperties.getProperty('voice.relay.address', '')}\""
        // The crash-report collector the "Crash report upload" switch sends to. Empty in the
        // shipped source, so no collector address is published with the code; when an operator
        // sets the property the upload runs for real. The switch is disabled while this is empty
        // rather than pretending to send something.
        buildConfigField "String", "CRASH_UPLOAD_ENDPOINT", "\"${localProperties.getProperty('crash.upload.endpoint', '')}\""
        ndk {
            // 64-bit only: 32-bit (armeabi-v7a) instances cannot run in this app
            // (Android processes lock in one bitness), so only ship arm64-v8a.
            // A separate 32-bit-focused launcher is planned for the future.
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildFeatures {
        viewBinding true
        prefab true
        buildConfig true
    }
    sourceSets {
        main {
            assets.srcDirs += rootProject.file('resources')
        }
    }
    buildTypes {
        release {
            // R8 shrinks and obfuscates the release build. JNI-bound classes are kept by
            // proguard-rules.pro; JniBindingParityTest runs against the minified build in CI so a
            // stripped native binding fails the build rather than the app at runtime.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                // Only the symbol table ships; full debug info goes out as a separate symbol file
                // for crash decoding instead of into every APK.
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            buildConfigField "boolean", "IS_BETA", "false"
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
            buildConfigField "boolean", "IS_BETA", "false"
        }
        beta {
            initWith release
            // The beta channel is the release build under a different name, so it inherits R8 and
            // the symbol-table level from release rather than redeclaring them.
            resValue "string", "app_name", "Glowberry Client Beta"
            buildConfigField "boolean", "IS_BETA", "true"
            matchingFallbacks = ["release"]
        }

    }
    packagingOptions {
        // Item 9: legacy packaging extracts the .so files to the app's lib dir on install, which
        // the launcher's own extractor and the preloader's file-based hooks rely on. Re-check
        // before turning this off.
        jniLibs.useLegacyPackaging = true
        resources.excludes += [
                "DebugProbesKt.bin"
        ]

        resources.pickFirsts += [
                "META-INF/INDEX.LIST",
                "META-INF/DEPENDENCIES",
                "META-INF/io.netty.versions.properties"
        ]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    ndkVersion = "28.2.13676358"
}

dependencies {
    implementation project(':minecraft')
    implementation project(':pojav_controls')
    implementation libs.minecraftauth
    implementation libs.commons.httpclient
    implementation libs.commons.gson
    implementation libs.core.splashscreen
    implementation libs.appcompat
    implementation libs.conscrypt.android
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.gson
    implementation libs.luaj.jse
    implementation libs.concentus
    // JavaBridge auto-porter: CFR (MIT) decompiles Java Edition .class files so their source
    // can be sent to an LLM for reimplementation. No Android APIs, plain jar.
    implementation libs.cfr
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.games.activity
    implementation libs.okhttp
    implementation libs.androidx.dynamicanimation
    implementation libs.androidx.browser
    implementation libs.bedrock.connection
    implementation libs.xcrash
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging
    // Microsoft Authentication Library (MSAL) for official OAuth
    implementation 'com.microsoft.identity.client:msal:2.2.3'
    testImplementation libs.junit
    // Android ships org.json in the platform, so the local unit-test runtime has stubs that
    // throw "not mocked". org.json:json is the same API as a plain jar, so a JSON-parsing
    // rule stays unit-testable without an instrumented test.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.glide
}
